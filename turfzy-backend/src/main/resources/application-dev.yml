# Dev profile — local MySQL + Redis from Docker Compose
spring:
  datasource:
    url: jdbc:mysql://localhost:3307/turfzy_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
    username: turfzy_user
    password: turfzy_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      pool-name: TurfzyHikariPool

  jpa:
    hibernate:
      ddl-auto: update    # Auto-updates schema in dev; NEVER use in prod
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

# JWT config (real secret goes in env variable in prod)
app:
  jwt:
    secret: "turfzy-dev-secret-key-change-in-production-min-256-bits-long"
    expiration-ms: 86400000       # 24 hours
    refresh-expiration-ms: 604800000  # 7 days

  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000"